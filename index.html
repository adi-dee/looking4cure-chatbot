<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eliz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --teal:#0d6b54;
  --teal-mid:#0e7a60;
  --teal-border:#b8dcd4;
  --g1:#eceae8;
  --g3:#c0bebb;
  --g9:#1a1917;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
}

/* ── Fill exactly whatever space Wix gives us ── */
html,body{
  height:100%;width:100%;
  margin:0;padding:0;
  font-family:var(--font);
  background:#ffffff;
  overflow:hidden;
}

#chat{
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
  background:#ffffff;
  overflow:hidden;
}

/* ── Header ── */
.ph{
  padding:14px 16px 12px;
  background:var(--teal);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;position:relative;overflow:hidden;
}
.ph::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#ff6eb4,#ffd54f,#69d5a8,#60b8ff,#c084fc,#ff6eb4);
  background-size:220% 100%;animation:rb 4s linear infinite;
}
@keyframes rb{0%{background-position:0 0}100%{background-position:220% 0}}
.ph-av{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.ph-info{flex:1}
.ph-info h2{font-size:15px;font-weight:600;color:#fff;line-height:1.2}
.ph-info p{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px}
.ph-dot{
  width:8px;height:8px;border-radius:50%;
  background:#6ee7b7;flex-shrink:0;
  animation:dp 2.2s ease-in-out infinite;
}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Messages ── */
.msgs{
  flex:1;overflow-y:auto;
  padding:14px 13px 8px;
  display:flex;flex-direction:column;gap:9px;
  scroll-behavior:smooth;
  background:#ffffff;
}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--g1);border-radius:3px}

.msg{display:flex;flex-direction:column;max-width:86%;animation:mi .22s ease}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end}

.bub{
  padding:10px 13px;border-radius:16px;
  font-size:14px;line-height:1.6;
}
.msg.bot .bub{
  background:#f6faf8;
  border:1px solid var(--teal-border);
  color:var(--g9);border-bottom-left-radius:4px;
}
.msg.user .bub{
  background:var(--teal);color:#fff;
  border-bottom-right-radius:4px;
}
.bub a{color:var(--teal)}
.msg.user .bub a{color:#a7f3d0}
.bub b{font-weight:600}

.mmeta{font-size:10px;color:var(--g3);margin-top:3px;padding:0 4px}
.msg.user .mmeta{text-align:right}

/* ── Read more ── */
.more-btn{
  display:inline-block;margin-top:6px;
  font-size:12px;color:var(--teal);
  background:none;border:none;cursor:pointer;
  font-family:var(--font);padding:0;text-decoration:underline;
}
.more-content{
  margin-top:8px;padding-top:8px;
  border-top:1px solid var(--teal-border);
  font-size:13px;line-height:1.65;color:var(--g9);
}

/* ── Suggestions ── */
.sugg-row{
  display:flex;flex-wrap:wrap;gap:5px;
  margin-top:4px;align-self:flex-start;
  animation:mi .28s ease;
}
.sugg{
  font-family:var(--font);font-size:12px;
  padding:5px 13px;border-radius:20px;
  border:1.5px solid var(--teal);
  color:var(--teal);background:transparent;
  cursor:pointer;transition:all .12s;white-space:nowrap;
}
.sugg:hover{background:var(--teal);color:#fff}
.sugg:disabled{opacity:.35;cursor:default}

/* ── Support card ── */
.scard{
  background:#fff0f7;border:1px solid #f5c0d8;
  border-radius:12px;padding:11px 13px;
  font-size:12.5px;line-height:1.6;
  color:#7a1a4a;margin-top:6px;
}
.scard strong{display:block;margin-bottom:6px;font-size:13px}
.scard a{color:#7a1a4a;font-weight:500}
.sline{margin-top:5px;padding-top:5px;border-top:1px solid #f5c0d8}

/* ── Typing ── */
.typ-wrap{align-self:flex-start;animation:mi .2s ease}
.typ{
  display:flex;align-items:center;gap:4px;
  padding:10px 13px;background:#f6faf8;
  border:1px solid var(--teal-border);
  border-radius:16px;border-bottom-left-radius:4px;width:fit-content;
}
.typ span{
  width:5px;height:5px;border-radius:50%;
  background:var(--teal-mid);opacity:.4;
  animation:td 1.2s ease-in-out infinite;
}
.typ span:nth-child(2){animation-delay:.15s}
.typ span:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.4;transform:none}30%{opacity:1;transform:translateY(-3px)}}

/* ── Input ── */
.inp-area{
  padding:10px 11px;border-top:1px solid var(--g1);
  display:flex;align-items:center;gap:8px;
  background:#fff;flex-shrink:0;
}
.inp{
  flex:1;font-family:var(--font);font-size:15px;
  border:1.5px solid var(--g1);border-radius:22px;
  padding:9px 15px;background:#f6faf8;color:var(--g9);
  outline:none;resize:none;transition:border-color .14s;
  line-height:1.4;min-height:40px;max-height:80px;
}
.inp:focus{border-color:var(--teal)}
.inp::placeholder{color:var(--g3)}
.snd{
  width:38px;height:38px;border-radius:50%;
  background:var(--teal);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .12s,transform .1s;
}
.snd:hover{opacity:.85}.snd:active{transform:scale(.93)}
.snd svg{width:15px;height:15px}

/* ── Disclaimer ── */
.disc{
  padding:5px 12px 6px;border-top:1px solid var(--g1);
  font-size:10px;color:var(--g3);
  text-align:center;background:#fff;flex-shrink:0;
}
</style>
</head>
<body>

<div id="chat">
  <div class="ph">
    <div class="ph-av">💊</div>
    <div class="ph-info">
      <h2>Eliz</h2>
      <p>Ask me anything about HIV</p>
    </div>
    <div class="ph-dot"></div>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="inp-area">
    <textarea class="inp" id="inp" placeholder="Ask anything…" rows="1"></textarea>
    <button class="snd" onclick="handleSend()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div class="disc">General information only · Not medical advice · No data stored</div>
</div>

<script>
// ══════════════════════════════════════════════════
// KNOWLEDGE BASE
// ══════════════════════════════════════════════════
const KB = {
  hiv:{
    short:`HIV is a virus that attacks the immune system. Without treatment it weakens your body over time — but with treatment, people live long, healthy lives.`,

    tags:["hiv","human immunodeficiency","what is hiv","explain hiv","how hiv works"],

  },
  aids:{
    short:`AIDS is the most advanced stage of HIV — it happens when HIV goes untreated for a long time and the immune system becomes severely weakened. With today's treatment, most people with HIV never get there.`,
    more:`Getting tested early and starting treatment makes a huge difference. Modern HIV meds are so effective that AIDS is now rare in people who have access to care.`,
    tags:["aids","acquired immunodeficiency","aids definition","hiv vs aids","difference aids hiv"],
    sugg:["art","viral_load","healthcare"]
  },
  art:{
    short:`ART (antiretroviral therapy) is the medication that keeps HIV under control. It doesn't cure HIV, but it stops the virus from multiplying — keeping you healthy and making transmission impossible.`,
    more:`Modern ART is usually one pill a day, or an injection every couple of months. Side effects are much rarer than they used to be.\n\nThe key is taking it consistently. Stopping gives the virus a chance to reactivate.\n\n💊 Check drug interactions: <a href="https://www.hiv-druginteractions.org" target="_blank">hiv-druginteractions.org</a>`,
    tags:["art","antiretroviral therapy","antiretroviral","treatment","hiv medication","hiv medicine","hiv drugs","what is art","how does treatment work"],
    sugg:["uu","viral_load","treatment_history"]
  },
  cure:{
    short:`There is no widely available cure for HIV yet. A small number of people have been cured through stem cell transplants — but that's a complex treatment for life-threatening cancer, not something available broadly. Research is advancing fast.`,
    more:`Scientists are working toward two goals:\n\n<b>Sterilising cure</b> — removing all HIV from the body.\n<b>Functional cure</b> — HIV stays but the immune system controls it without medication.\n\nNeither is available yet, but clinical trials are testing new approaches every year.`,
    tags:["cure","hiv cure","is there a cure","cured","cure for hiv","when will there be a cure","can hiv be cured"],
    sugg:["cure_strategies","bnabs","cure_cases"]
  },
  prep:{
    short:`PrEP is medication that HIV-negative people take to prevent HIV. Taken correctly, it's over 99% effective against sexual transmission.`,
    more:`<b>Options:</b>\n• Daily pill\n• Injection every 2 months\n• Lenacapavir — injection every 6 months (still expensive, not everywhere yet)\n\nPrEP doesn't protect against other STIs, so regular testing still matters.`,
    tags:["prep","pre-exposure prophylaxis","hiv prevention","prevent hiv","prep pill","prep injection","lenacapavir","what is prep"],
    sugg:["uu","hiv","art"]
  },
  uu:{
    short:`U=U means Undetectable = Untransmittable. If you're on treatment and your viral load is undetectable, you cannot pass HIV to a sexual partner. This is scientifically proven.`,
    more:`Confirmed by major international studies and accepted by all leading health organisations.\n\nPeople on effective treatment pose zero risk of sexual transmission to their partners. U=U is also a powerful tool against stigma.`,
    tags:["u=u","undetectable untransmittable","undetectable equals untransmittable","cannot transmit hiv","cannot pass hiv","undetectable"],
    sugg:["art","viral_load","prep"]
  },
  viral_load:{
    short:`Viral load is the amount of HIV in your blood. The goal of treatment is to get it so low it becomes undetectable — great for your health, and means you can't pass HIV on sexually.`,
    more:`When you're undetectable, HIV is still in your body (hiding in the reservoir), but it's not active. This is what U=U refers to.`,
    tags:["viral load","undetectable","virus in blood","what is viral load","viral load test","hiv levels"],
    sugg:["uu","art","reservoir"]
  },
  reservoir:{
    short:`Even on perfect treatment, HIV can hide silently inside certain cells. This hidden stash is called the reservoir — and it's the main reason HIV can't be fully cured yet.`,
    more:`Think of it like a virus in sleep mode. Treatment keeps it asleep, but can't destroy it. If you stop treatment, it wakes up.\n\nThe reservoir is tiny — about one infected cell per 100,000 — but incredibly hard to find and remove. Scientists call it "a needle in a haystack." Most cure research is focused on solving this.`,
    tags:["reservoir","hiv reservoir","hidden hiv","latency","latent hiv","sleeping hiv","why no cure","hiv hiding","hiv persistence"],
    sugg:["cure_strategies","bnabs","q4ddpcr"]
  },
  cure_cases:{
    short:`As of 2024, nine people have been reported cured of HIV. All had serious blood cancer and received stem cell transplants from donors with a rare genetic mutation that makes immune cells HIV-resistant.`,
    more:`These cases are remarkable but the treatment is extremely complex and risky, only for life-threatening cancer. It's not available as a general HIV cure.\n\nStill, each case teaches researchers a lot about how a cure could work.`,
    tags:["cured","hiv cured","berlin patient","stem cell","people cured hiv","has anyone been cured","cure cases","9 people cured"],
    sugg:["ccr5","cure_types","cure_strategies"]
  },
  cure_types:{
    short:`Scientists are working toward two kinds of cure: a sterilising cure (removing all HIV from the body) and a functional cure (the immune system controls HIV permanently without medication).`,
    more:`<b>Sterilising cure:</b> All HIV gone. Very hard — even tiny traces can bring it back.\n\n<b>Functional cure / remission:</b> Virus stays but permanently silent without treatment.\n\n<b>Elite controllers</b> are rare people whose immune systems do this naturally — researchers study them intensively.`,
    tags:["types of cure","sterilising cure","functional cure","hiv remission","sterile cure","elite controllers","long term remission"],
    sugg:["cure_strategies","bnabs","cure_cases"]
  },
  cure_strategies:{
    short:`There's no cure yet, but researchers are testing several exciting approaches — from gene editing to re-engineering immune cells to powerful new antibodies.`,
    more:`<b>Shock & Kill:</b> Wake up sleeping HIV so the immune system can destroy it.\n\n<b>Block & Lock:</b> Keep HIV permanently silenced forever.\n\n<b>CAR-T cells:</b> Re-engineer immune cells to hunt HIV-infected cells.\n\n<b>CRISPR:</b> Molecular scissors that cut HIV out of DNA.\n\n<b>Therapeutic vaccines:</b> Help the immune system control HIV — some use mRNA tech like COVID vaccines.\n\n<b>bNAbs:</b> Very promising antibodies — ask me about them!`,
    tags:["cure strategies","shock and kill","kick and kill","block and lock","car-t cells","crispr","gene editing","therapeutic vaccine","mrna hiv vaccine","hiv cure research","cure approaches"],
    sugg:["bnabs","ati","q4ddpcr"]
  },
  bnabs:{
    short:`bNAbs are powerful lab-made antibodies that block HIV from entering cells and help clear infected ones. They're one of the most promising areas in HIV cure research right now.`,
    more:`HIV mutates a lot, but some parts never change — bNAbs target those stable parts.\n\n<b>2025 results:</b> About 3 in 4 participants controlled the virus for 20+ weeks without ART. Some stayed suppressed for 2+ years — suggesting the immune system took over.\n\nThe goal: replace daily pills with infusions every few months.`,
    tags:["bnabs","broadly neutralising antibodies","broadly neutralizing antibodies","neutralising antibodies","bnab","antibody treatment hiv","antibodies hiv"],
    sugg:["ati","cure_types","q4ddpcr"]
  },
  q4ddpcr:{
    short:`Q4ddPCR is a new lab test developed at Charité Berlin that measures the HIV reservoir more accurately. It uses four targets instead of two, catching what previous tests missed.`,
    more:`Published in <i>Nature Communications</i> 2026:\n\n• Detects intact HIV in <b>95% of samples</b> vs 79% before\n• More accurately tracks how fast the reservoir shrinks on treatment\n• Better predicts which virus can actually replicate\n\nThis precision matters for evaluating whether new cure strategies are actually working.`,
    tags:["q4ddpcr","reservoir test","reservoir assay","ddpcr","ipda","intact proviral dna","measure hiv reservoir","latest hiv research","new hiv research","nature communications hiv","charite hiv research"],
    sugg:["reservoir","cure_strategies","bnabs"]
  },
  ati:{
    short:`ATI (Analytical Treatment Interruption) is a supervised pause in HIV medication used inside clinical studies — to see if a new therapy can control the virus without ART.`,
    more:`Only done under close medical supervision, never alone. The team monitors you throughout and you decide together when to restart medication.\n\nOne participant said: <i>"From the day I was infected, I felt I'd lost control. Joining a trial gave me some of that control back."</i>`,
    tags:["ati","analytical treatment interruption","pause hiv treatment","stop hiv medication","treatment interruption","stopping art hiv"],
    sugg:["bnabs","cure_strategies","clinical_trials"]
  },
  treatment_history:{
    short:`HIV treatment has come a long way. In the 80s it was brutal. Now it can be one pill a day or an injection every two months. And science is still moving fast.`,
    more:`• 1983 – HIV identified. Activists like ACT UP fought for faster research.\n• 1987 – First antiretroviral approved.\n• 1996 – Combination therapy made HIV manageable.\n• 2006 – Single daily pill.\n• 2021 – Long-acting injection every 2 months.\n• Now – Testing 4–6 month injections, bNAbs, and more.`,
    tags:["treatment history","history of hiv treatment","hiv timeline","evolution of hiv treatment","azt","1987 hiv","1996 hiv","long acting hiv injection","how treatment changed"],
    sugg:["art","prep","bnabs"]
  },
  ccr5:{
    short:`CCR5 is a protein HIV uses like a door handle to get into your cells. Less than 1% of people have a natural mutation that breaks this handle — making them naturally resistant to HIV.`,
    more:`This is why the Berlin Patient and others were cured through stem cell transplants — their donors had this mutation, giving them HIV-resistant immune cells.`,
    tags:["ccr5","ccr5 mutation","door handle hiv","hiv resistant","delta 32","natural hiv resistance","genetic hiv resistance"],
    sugg:["cure_cases","reservoir","hiv"]

  global:{
    short:`41 million people are living with HIV globally. 9 million still don't have access to treatment. Budget cuts are making things worse — which is exactly why cure research matters so much.`,
    more:`UNAIDS modelling shows continued funding cuts could mean 4 million more AIDS-related deaths and 6 million new infections by 2029.\n\nA cure would reduce dependence on health systems that are becoming more fragile and unequal.`,
    tags:["global hiv","hiv worldwide","hiv statistics","hiv numbers","hiv deaths","hiv infections","hiv access","hiv funding","unaids","hiv budget cuts","41 million hiv","how many people have hiv"],
    sugg:["about","cure_types","art"]

  clinical_trials:{
    short:`Clinical trials are how new HIV treatments get tested — and they've given us every treatment available today. Participation is always voluntary, with full information upfront.`,
    more:`Trials progress through phases: safety (Phase I), early effects (Phase II), large-scale effectiveness (Phase III). You always give informed consent and can stop at any time.`,

  about:{

  healthcare:{

    more:`A 2021 study found 60% of people with HIV in Germany face discrimination in healthcare. Not okay — and not your fault.\n\n<b>Your rights:</b> to be respected, to say no, to ask questions, to get a second opinion.\n\nCheck drug interactions: <a href="https://www.hiv-druginteractions.org" target="_blank">hiv-druginteractions.org</a>`,
    tags:["doctor hiv","healthcare hiv","hiv appointment","hiv discrimination","hiv stigma doctor","rights hiv patient","queer medics","find hiv doctor","hiv healthcare germany"],

    more:`Stigma affects access to care, mental health, and quality of life — especially for queer communities, trans people, sex workers, and people who use drugs.\n\nLooking4Cure is committed to making HIV research inclusive.`,

    sugg:["cure_strategies","bnabs","hiv"]

  support:{

  // ── Local resources ──
  local_resources:{
    short:`For personal support, testing, or PrEP access, your best first step is a local community organisation or sexual health clinic. They know your area and can guide you directly.`,
    more:`In Germany, try:\n• <a href="https://berlin.aidshilfe.de" target="_blank">Berliner AIDS-Hilfe</a> — counselling, support, community\n• <a href="https://queermedics.de" target="_blank">Queer Medics</a> — find inclusive doctors near you\n• Your local sexual health clinic or Gesundheitsamt\n\nEliz shares general information — for personal medical advice, always speak with a healthcare provider.`,

  hiv_lifecycle:{
    short:`HIV has a specific way of taking over cells. It enters, copies its genetic material into the cell's DNA, then uses that cell to make new virus particles that spread to others.`,
    more:`The steps:\n1. HIV attaches to a CD4 cell using the CCR5 receptor\n2. It releases its genetic material into the cell\n3. Uses <b>reverse transcription</b> to convert RNA into DNA\n4. <b>Integration</b> — HIV DNA is inserted into the cell's own DNA\n5. The cell is used to produce new virus\n6. New virus particles are released to infect more cells\n\nEach step is a potential target for treatment — which is why combination ART works so well.`,

  // ── CD4 cells ──
  cd4:{
    short:`CD4 T cells are key immune cells that coordinate your body's defence. HIV specifically targets and destroys them — weakening the immune system over time.`,
    more:`A healthy CD4 count is around 500–1,500 cells/mm³. As HIV destroys CD4 cells:\n\n• The immune system weakens\n• The body becomes vulnerable to infections\n• Risk of AIDS increases\n\nWith ART, CD4 counts recover and stay high. Your doctor monitors your CD4 count at regular checkups alongside your viral load.`,
    tags:["cd4","cd4 cells","cd4 count","t cells hiv","t helper cells","immune cells hiv","cd4 t cells","what are cd4 cells","hiv immune cells","low cd4"],

const VAGUE = new Set(['hi','hey','hello','ok','okay','sure','yes','no',
  'thanks','thank you','cool','nice','interesting','really','wow','what',
  'what else','something else','more','tell me more','and','so','right',

// ══════════════════════════════════════════════════
// SEARCH ENGINE
// ══════════════════════════════════════════════════
function findEntry(q) {
  const clean = q.toLowerCase().trim().replace(/[?!.,]/g,'').trim();

  // Too short
  if (clean.length < 3) return null;

  // Guaranteed exact map
  if (GUARANTEED[clean]) return KB[GUARANTEED[clean]];

  // Personal statements → redirect to local resources
  if (PERSONAL.some(p => clean.includes(p))) return KB.local_resources;

  // Distress
  const distress = ['help me','not ok','scared','crisis','distress',
    'desperate','afraid','hopeless','suicid','self harm','hurting',
    'depressed','anxious','not coping','struggling'];
  if (distress.some(w => clean.includes(w))) return KB.support;

  // Vague words → no match
  if (VAGUE.has(clean)) return null;

  // Word-level scoring — only words longer than 3 chars
  const words = clean.split(/\s+/).filter(w => w.length > 3);

  // If no meaningful words after filtering, return null
  if (words.length === 0 && clean.length < 6) return null;

  let best = null, bestScore = 0;

  Object.values(KB).forEach(entry => {
    let s = 0;
    entry.tags.forEach(tag => {
      const tagClean = tag.toLowerCase();
      // Exact full match
      if (clean === tagClean) { s += 25; return; }
      // Query contains full tag
      if (clean.includes(tagClean) && tagClean.length > 4) { s += 15; return; }
      // Tag contains full query (only meaningful queries)
      if (tagClean.includes(clean) && clean.length > 5) { s += 10; return; }
      // Word overlap
      const tagWords = tagClean.split(' ').filter(tw => tw.length > 3);
      tagWords.forEach(tw => words.forEach(qw => {
        if (tw === qw) s += 8;
        else if (tw.startsWith(qw) && qw.length > 4) s += 4;
        else if (qw.startsWith(tw) && tw.length > 4) s += 4;
      }));
    });
    if (s > bestScore) { bestScore = s; best = entry; }
  });

  // Require meaningful score
  return bestScore >= 8 ? best : null;
}

// ══════════════════════════════════════════════════
// UI
// ══════════════════════════════════════════════════
let expandSet = new Set();
const tn = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const sb = () => { const m = document.getElementById('msgs'); m.scrollTop = m.scrollHeight; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nl2br = s => s.replace(/\n/g,'<br>');

function showWelcome() {
  const area = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = `<div class="bub">Hey 👋 I'm <b>Eliz</b>. Ask me anything about HIV — treatment, prevention, cure research, or just getting your head around it all.<br><br><span style="font-size:12px;color:#7c7a77">💬 Please don't share personal information in this chat. I'm here for general HIV information — not personal medical advice.</span></div>
  <div class="mmeta">${tn()}</div>`;
  area.appendChild(d);
  addSuggestions(['hiv','cure','prep'], true);
  sb();
}

function addUserMsg(text) {
  const area = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="bub">${esc(text)}</div><div class="mmeta">${tn()}</div>`;
  area.appendChild(d); sb();
}

function addBotMsg(entry) {
  const area = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg bot';
  const entryId = Object.keys(KB).find(k => KB[k] === entry);

  let html = `<div class="bub">${nl2br(entry.short || '')}`;
  if (entry.more && entryId && !expandSet.has(entryId)) {
    html += `<br><button class="more-btn" onclick="expandEntry('${entryId}',this)">Read more ↓</button>`;
  }
  html += `</div>`;

  if (entry.isSupport) {
    html += `<div class="scard">
      <strong>🤝 Here for you</strong>
      <div><b>Berliner AIDS-Hilfe</b><br>
        <a href="tel:+4930886400">+49 30 886 400 0</a><br>
        <a href="https://berlin.aidshilfe.de" target="_blank">berlin.aidshilfe.de</a>
      </div>
      <div class="sline">Medical helpline Germany 24/7: <a href="tel:116117"><b>116 117</b></a></div>
      <div class="sline">Side effects: <a href="https://nebenwirkungen.bund.de" target="_blank">nebenwirkungen.bund.de</a></div>
    </div>`;
  }

  html += `<div class="mmeta">${tn()}</div>`;
  d.innerHTML = html;
  area.appendChild(d);

  // Build fresh suggestion list — use entry sugg + rotate pool to avoid repeats
  let suggIds = (entry.sugg || []).filter(id => KB[id] && id !== entryId);
  if (suggIds.length < 3) {
    const pool = nextPool().filter(id => id !== entryId && !suggIds.includes(id) && KB[id]);
    suggIds = [...suggIds, ...pool].slice(0, 3);
  }
  addSuggestions(suggIds);
  sb();
}

function expandEntry(id, btn) {
  expandSet.add(id);
  const entry = KB[id];
  if (!entry?.more) return;
  const bub = btn.closest('.bub');
  btn.remove();
  const div = document.createElement('div');
  div.className = 'more-content';
  div.innerHTML = nl2br(entry.more);
  bub.appendChild(div); sb();
}

function addSuggestions(ids, isWelcome=false) {
  const area = document.getElementById('msgs');
  const valid = ids.filter(id => KB[id]).slice(0,3);
  if (!valid.length) return;
  const row = document.createElement('div');
  row.className = 'sugg-row';
  if (isWelcome) row.style.marginTop = '2px';
  valid.forEach(id => {
    const label = LABELS[id] || id;
    const btn = document.createElement('button');
    btn.className = 'sugg';
    btn.textContent = label;
    btn.onclick = () => {
      row.querySelectorAll('.sugg').forEach(b => b.disabled = true);
      row.style.opacity = '.4';
      addUserMsg(label);
      respond(null, id);
    };
    row.appendChild(btn);
  });
  area.appendChild(row); sb();
}

function showTyping() {
  const area = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'typ-wrap'; d.id = 'typ';
  d.innerHTML = `<div class="typ"><span></span><span></span><span></span></div>`;
  area.appendChild(d); sb();
}
function hideTyping() { const d = document.getElementById('typ'); if(d) d.remove(); }

function respond(query, forcedId) {
  showTyping();
  setTimeout(() => {
    hideTyping();
    if (forcedId && KB[forcedId]) { addBotMsg(KB[forcedId]); return; }
    const entry = findEntry(query);
    if (!entry) {
      const fb = FALLBACKS[fbIdx % FALLBACKS.length]; fbIdx++;
      const area = document.getElementById('msgs');
      const d = document.createElement('div');
      d.className = 'msg bot';
      d.innerHTML = `<div class="bub">${fb.msg}</div><div class="mmeta">${tn()}</div>`;
      area.appendChild(d);
      addSuggestions(fb.sugg); sb();
      return;
    }
    addBotMsg(entry);
  }, 350 + Math.random()*250);
}

function handleSend() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  addUserMsg(text); respond(text);
}

document.getElementById('inp').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});
document.getElementById('inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

window.addEventListener('load', showWelcome);
